# Site settings
title: "Windows MIDI Services Documentation"
email: "midi@microsoft.com"
description: "Microsoft Windows MIDI Services API, SDK, and tools"
keywords: "midi, midi2, music, musicians, audio, Windows, Microsoft"
baseurl: "/midi" # the subpath of your site, e.g. /blog
url: https://microsoft.github.io
cover_image:  # Image will Display in Social Media When share the website
repository: microsoft/midi

## Theme Options
twitter_username: pete_brown
github_username:  psychlist1972

twitter: https://twitter.com/pete_brown
github: https://github.com/psychlist1972



# MIDI site-specific
sdk_idl_root_url: "https://github.com/microsoft/MIDI/tree/main/src/in-box/Client/WinRT/core/"

# Build settings
markdown: kramdown
theme: minima

# DO NOT REMOVE. Every published page URL is /folder/name/ because of this. Dropping it emits
# flat name.html files instead and breaks every inbound link to the site.
permalink: /:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag  

# setting exclude replaces Jekyll's defaults, so the default entries are repeated here
exclude:
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - gulpfile.js
  - package.json
  - package-lock.json
  - assets/scss

        