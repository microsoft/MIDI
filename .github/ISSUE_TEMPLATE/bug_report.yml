name: "🕷️ Bug Report"
description: File a bug report not related to endpoint naming or online documentation
type: Bug
title: "[BUG]: "
labels:
  - "bug :lady_beetle:"
  - "needs triage :ambulance:"
assignees: ["Psychlist1972"]
projects: microsoft/339

body:
- type: markdown
  attributes:
    value: Thank you for filing a bug report for Windows MIDI Services. Please be sure to [search for existing issues](https://github.com/microsoft/MIDI/labels/bug%20%3Alady_beetle%3A) before filing a new bug. If you are a user and not a developer, and are seeking support, please go to the Discord server https://aka.ms/mididiscord. If you are not up to date with your Windows Updates, we recommend you do that first. If you have uninstalled Windows Updates, we recommend you fix that situation first.

- type: checkboxes
  id: steps-completed
  attributes:
    label: Report pre-requisites
    description: These steps must be completed before filing a bug report
    options:
    - label: I have searched this repo for existing issues to confirm this is not a duplicate
      required: true
    - label: I agree to follow this project's Code of Conduct
      required: true
    - label: I acknowledge that if I do not respond to follow-up questions in a timely manner, the issue may be closed without any changes or fixes
      required: true

- type: checkboxes
  id: clarity-and-disclosure
  attributes:
    label: Clarity and Disclosure
    description: These steps must be completed before filing a bug report
    options:
    - label: I confirm that any AI analysis included in this report is clearly called out / tagged as AI-generated with "AI Generated Content". Reports with suspected AI content may be closed if not disclosed.
      required: true
    - label: I confirm that I will quickly follow-up to questions or requests for additional detail, otherwise the issue may be closed
      required: true

- type: input
  id: windows-version
  attributes:
    label: Windows Version
    description: In Windows Settings > System > About. For Insider builds, this is at the bottom right of the screen. Example 27788.rs_prerelease
  validations:
    required: true

- type: checkboxes
  id: bug-type
  attributes:
    label: Type of bug
    description: How would you classify this bug report?
    options:
      - label: Windows doesn't recognize MIDI device (doesn't show in device manager)
      - label: Application doesn't recognize MIDI device or ports
      - label: Cannot update firmware on MIDI device (specify device, app, and firmware info)
      - label: MIDI device is recognized, but cannot send or receive messages
      - label: Sent or received MIDI messages are corrupted
      - label: Application not working as expected
      - label: MIDI 1.0 ports not named as expected
      - label: Performance not as expected
      - label: Localization issue (incorrect or missing language for Windows running something other than en-US)
      - label: General application crash or hang
      - label: MIDI Service crash or hang requiring Windows reboot
      - label: Windows bugcheck / BSOD (please include in the areas below the device id from Windows Settings About page or a link to your crash dump uploaded to a sharing service)
      - label: Other or Unsure (please indicate in additional notes section below)

- type: checkboxes
  id: bug-location
  attributes:
    label: Location
    description: Where did you discover this bug?
    options:
      - label: Application using WinMM MIDI 1.0 (Classic API). Name provided below.
      - label: Application using WinRT MIDI 1.0 (Windows 10 MIDI). Name provided below.
      - label: Application using Windows MIDI Services API (sometimes referred to as MIDI 2.0). Name provided below.
      - label: Other app/DAW/tool. Not sure about which API or SDK it uses. Name provided below.
      - label: Windows MIDI Services tools like MIDI Settings, Console, etc.
      - label: Directly in Windows MIDI Services SDK (for Developers only, please provide repro code)
      - label: General Windows shell (Device Manager, Settings, Services, etc.). Name provided below.
      - label: Windows MIDI 2.0 Class Driver (usbmidi2-acx.sys)
      - label: Windows MIDI 1.0 Class Driver (usbaudio.sys)
      - label: Vendor-provided MIDI driver (please provide details below)
      - label: Other or Unsure (please indicate in additional notes section below)

- type: input
  id: app-name
  attributes:
    label: Application Name and Version
    description: Name and version of the application where you noticed the error, if applicable
    placeholder: Application name and version, like "Cubase 15.1.1"
  validations:
    required: false

- type: input
  id: midi-device-name
  attributes:
    label: MIDI Device
    description: Brand/Make/Model/Name of the MIDI device (or virtual device provider) used
    placeholder: MIDI device name, like "Roland A-88MKII"
  validations:
    required: false

- type: input
  id: vendor-driver
  attributes:
    label: Vendor Driver
    description: If you used a third-party driver (Roland, Korg, Yamaha, inMusic, etc.), please provide the name and version of the driver used. You can often find this in Apps > Installed Apps in Windows Settings.
    placeholder: Driver brand, name, and version, like "Yamaha USB MIDI v3.1.5"
  validations:
    required: false

- type: textarea
  id: mididiag-output
  attributes:
    label: Output from the MIDI Diagnostics Tool
    description: Use the installer from https://aka.ms/midi, open the MIDI Settings app, and go to the troubleshooting page. Capture the resulting MIDI system information and paste the entire text here. It is formatted as a code block automatically, so you do not need to add backticks.
    render: text
  validations:
    required: true

- type: checkboxes
  id: repro-disclosure
  attributes:
    label: Repro
    description: DAWs and DJ and other apps are complex, and can have their own bugs.
    options:
    - label: I confirm that I was able to reproduce this issue using a simple app like `midi.exe`, `midi1monitor.exe` or `Pocket MIDI`
      required: false
    - label: I tried but was unable to reproduce this issue using a simple application
      required: false

- type: textarea
  id: devices-tested
  attributes:
    label: Devices tested, and which ones fail
    description: One device failing usually means a device-specific or driver-specific problem, not a problem with all MIDI. Please list what you tried, including anything that worked, so we can scope the bug correctly. If you only have one device, say so.
    value: |
      | Device (make and model) | Driver in use | Result |
      |---|---|---|
      |  |  | fails |
      |  |  | works |
  validations:
    required: false

- type: textarea
  id: api-paths-tested
  attributes:
    label: Which MIDI API paths did you test?
    description: This is the single most useful thing you can tell us. A problem that happens on the classic WinMM path but not on the Windows MIDI Services path is a completely different bug, with a different fix, than one that happens on both. Leave a row blank if you did not test it.
    value: |
      | Path | Suggested tool | Result (works / fails / not tested) |
      |---|---|---|
      | Windows MIDI Services (MIDI 2.0 / UMP) | MIDI Monitor, or `midi endpoint monitor` |  |
      | WinRT MIDI 1.0 (Windows 10 MIDI) | any WinRT MIDI 1.0 app |  |
      | WinMM (classic MIDI 1.0) | `midi1monitor.exe` |  |
  validations:
    required: false

- type: dropdown
  id: api-mode
  attributes:
    label: API mode used when you saw the problem
    description: "Run `midi api-mode get`, or check `UseLegacyMidi` under HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Drivers32. Almost everyone is on the default. More information: https://microsoft.github.io/MIDI/kb/how-to-change-api-mode/"
    options:
      - Full Windows MIDI Services (0, the default)
      - Legacy API mode (1)
      - Hybrid API mode (2)
      - Not sure
  validations:
    required: true

- type: dropdown
  id: legacy-mode-result
  attributes:
    label: Does the problem also happen in Legacy API mode?
    description: "Worth trying for anything involving an older MIDI 1.0 app, because Legacy API mode takes the MIDI service out of the path entirely. If the problem happens there too, it is not caused by Windows MIDI Services. Legacy API mode is also a supported way to keep working while we investigate, but you give up multi-client sharing, built-in loopbacks, Network MIDI 2.0, Bluetooth LE MIDI, and USB MIDI 2.0 devices. Instructions: https://microsoft.github.io/MIDI/kb/how-to-change-api-mode/"
    options:
      - Yes, it still happens in Legacy API mode
      - No, Legacy API mode works correctly
      - I have not tried Legacy API mode
      - Not applicable to this issue
  validations:
    required: false

- type: textarea
  id: observations
  attributes:
    label: Your personal observation that led to the bug report
    description: AI Generated bug reports get into the weeds too quickly, and usually neglect to explain what you actually saw, and why you filed a bug in the first place. This part is incredibly important, please do not use an AI to fill out this field.
    placeholder: Your own personal (not AI-generated) observations that led to the bug report. What did you see? What wasn't working? What was expected to happen?
  validations:
    required: true

- type: textarea
  id: repro-steps
  attributes:
    label: Steps to reproduce
    description: Please include screenshots when possible
    placeholder: Detailed steps to reproduce the bug or issue
  validations:
    required: true

- type: textarea
  id: additional-notes
  attributes:
    label: Additional notes
    description: Any additional notes or information which may be relevant. If you have used specific editor apps or older device apps as part of the report, please provide links to the download pages or company page.
    placeholder: Any additional notes, information, or links which may be relevant
  validations:
    required: false
