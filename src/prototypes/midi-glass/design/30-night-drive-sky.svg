<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Night Drive's deck picture: a sunset sky, a striped sun sitting on the horizon, and a
       grid floor running away to it. It is an ordinary deck picture: the engine already fits
       one to the page without stretching it (cover, centered), so the sun stays round on any
       page shape. The horizon is at 58 percent, which is where the measurements put it. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#140A2E"/>
      <stop offset="0.50" stop-color="#3A1258"/>
      <stop offset="0.80" stop-color="#9C2A6A"/>
      <stop offset="1" stop-color="#FF6A4D"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="290" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD23F"/>
      <stop offset="0.55" stop-color="#FF7B39"/>
      <stop offset="1" stop-color="#FF3FA4"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="800" cy="470" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF3FA4" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#FF3FA4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FF3FA4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="520" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1C0B30"/>
      <stop offset="1" stop-color="#08040F"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="470" x2="0" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF3FA4" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#FF6A9E" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FF3FA4" stop-opacity="0"/>
    </linearGradient>
    <!-- the cuts through the sun, wider toward the horizon -->
    <mask id="cuts" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
      <rect x="0" y="0" width="1600" height="520" fill="#FFFFFF"/>
      <rect x="0" y="392" width="1600" height="4" fill="#000000"/>
      <rect x="0" y="420" width="1600" height="6" fill="#000000"/>
      <rect x="0" y="446" width="1600" height="8" fill="#000000"/>
      <rect x="0" y="470" width="1600" height="10" fill="#000000"/>
      <rect x="0" y="492" width="1600" height="12" fill="#000000"/>
      <rect x="0" y="512" width="1600" height="8" fill="#000000"/>
    </mask>
    <!-- the grid fades in out of the haze instead of piling up at the vanishing point -->
    <linearGradient id="gridfade" x1="0" y1="520" x2="0" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridmask" maskUnits="userSpaceOnUse" x="0" y="520" width="1600" height="380">
      <rect x="0" y="520" width="1600" height="380" fill="url(#gridfade)"/>
    </mask>
    <clipPath id="floor"><rect x="0" y="521" width="1600" height="379"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1600" height="520" fill="url(#sky)"/>

  <g fill="#FFFFFF">
    <circle cx="96" cy="58" r="1.4" opacity="0.8"/><circle cx="212" cy="140" r="1" opacity="0.6"/>
    <circle cx="318" cy="36" r="1.6" opacity="0.9"/><circle cx="402" cy="112" r="1" opacity="0.5"/>
    <circle cx="486" cy="210" r="1.2" opacity="0.5"/><circle cx="560" cy="64" r="1" opacity="0.7"/>
    <circle cx="642" cy="150" r="1.4" opacity="0.6"/><circle cx="720" cy="30" r="1" opacity="0.8"/>
    <circle cx="870" cy="92" r="1.2" opacity="0.7"/><circle cx="948" cy="190" r="1" opacity="0.5"/>
    <circle cx="1030" cy="48" r="1.6" opacity="0.9"/><circle cx="1110" cy="130" r="1" opacity="0.6"/>
    <circle cx="1196" cy="70" r="1.2" opacity="0.8"/><circle cx="1270" cy="210" r="1" opacity="0.5"/>
    <circle cx="1348" cy="34" r="1.4" opacity="0.7"/><circle cx="1430" cy="118" r="1" opacity="0.6"/>
    <circle cx="1512" cy="60" r="1.6" opacity="0.8"/><circle cx="1560" cy="188" r="1" opacity="0.5"/>
    <circle cx="40" cy="176" r="1" opacity="0.6"/><circle cx="150" cy="246" r="1" opacity="0.4"/>
    <circle cx="276" cy="92" r="1" opacity="0.7"/><circle cx="1480" cy="250" r="1" opacity="0.4"/>
    <circle cx="1386" cy="160" r="1.2" opacity="0.6"/><circle cx="760" cy="118" r="1" opacity="0.5"/>
  </g>

  <rect x="0" y="0" width="1600" height="900" fill="url(#sunglow)"/>
  <circle cx="800" cy="520" r="230" fill="url(#sun)" mask="url(#cuts)"/>

  <rect x="0" y="520" width="1600" height="380" fill="url(#ground)"/>

  <g clip-path="url(#floor)" mask="url(#gridmask)" stroke="#FF3FA4" stroke-opacity="0.55" fill="none">
    <!-- the rungs, closer together the further away they are -->
    <line x1="0" y1="523" x2="1600" y2="523" stroke-width="1"/>
    <line x1="0" y1="531" x2="1600" y2="531" stroke-width="1"/>
    <line x1="0" y1="543" x2="1600" y2="543" stroke-width="1.2"/>
    <line x1="0" y1="560" x2="1600" y2="560" stroke-width="1.3"/>
    <line x1="0" y1="582" x2="1600" y2="582" stroke-width="1.5"/>
    <line x1="0" y1="611" x2="1600" y2="611" stroke-width="1.7"/>
    <line x1="0" y1="645" x2="1600" y2="645" stroke-width="1.9"/>
    <line x1="0" y1="684" x2="1600" y2="684" stroke-width="2.1"/>
    <line x1="0" y1="728" x2="1600" y2="728" stroke-width="2.3"/>
    <line x1="0" y1="776" x2="1600" y2="776" stroke-width="2.5"/>
    <line x1="0" y1="830" x2="1600" y2="830" stroke-width="2.7"/>
    <line x1="0" y1="890" x2="1600" y2="890" stroke-width="3"/>
    <!-- the rails, all running to the middle of the sun -->
    <line x1="800" y1="520" x2="-1720" y2="900" stroke-width="2"/>
    <line x1="800" y1="520" x2="-1300" y2="900" stroke-width="2"/>
    <line x1="800" y1="520" x2="-880" y2="900" stroke-width="2"/>
    <line x1="800" y1="520" x2="-460" y2="900" stroke-width="2"/>
    <line x1="800" y1="520" x2="-40" y2="900" stroke-width="2"/>
    <line x1="800" y1="520" x2="380" y2="900" stroke-width="2"/>
    <line x1="800" y1="520" x2="800" y2="900" stroke-width="2"/>
    <line x1="800" y1="520" x2="1220" y2="900" stroke-width="2"/>
    <line x1="800" y1="520" x2="1640" y2="900" stroke-width="2"/>
    <line x1="800" y1="520" x2="2060" y2="900" stroke-width="2"/>
    <line x1="800" y1="520" x2="2480" y2="900" stroke-width="2"/>
    <line x1="800" y1="520" x2="2900" y2="900" stroke-width="2"/>
    <line x1="800" y1="520" x2="3320" y2="900" stroke-width="2"/>
  </g>

  <rect x="0" y="470" width="1600" height="110" fill="url(#haze)"/>
  <rect x="0" y="519" width="1600" height="2" fill="#FFB3D9"/>
</svg>
