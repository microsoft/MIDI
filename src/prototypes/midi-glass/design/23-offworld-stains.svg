<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512' viewBox='0 0 512 512'>
<!-- MIDI Glass comp, screen 23: what the rain has done to the wall. Dark streaks where water
     has run down it, a few pale ones where it is still running, and broad grime under both.
     Every frequency is a whole number of cycles across 512, so the tile repeats without a seam. -->
<filter id='grime' x='0' y='0' width='100%' height='100%' color-interpolation-filters='sRGB'>
    <feTurbulence type='fractalNoise' baseFrequency='0.0078125' numOctaves='3' seed='4' stitchTiles='stitch'/>
    <feColorMatrix type='matrix' values='0 0 0 0 0.035  0 0 0 0 0.028  0 0 0 0 0.02  0 2.0 0 0 -0.95'/>
</filter>
<filter id='runs' x='0' y='0' width='100%' height='100%' color-interpolation-filters='sRGB'>
    <feTurbulence type='fractalNoise' baseFrequency='0.125 0.0078125' numOctaves='2' seed='11' stitchTiles='stitch'/>
    <feColorMatrix type='matrix' values='0 0 0 0 0.02  0 0 0 0 0.02  0 0 0 0 0.015  1.6 0 0 0 -0.84'/>
</filter>
<filter id='wet' x='0' y='0' width='100%' height='100%' color-interpolation-filters='sRGB'>
    <feTurbulence type='fractalNoise' baseFrequency='0.25 0.00390625' numOctaves='2' seed='23' stitchTiles='stitch'/>
    <feColorMatrix type='matrix' values='0 0 0 0 0.76  0 0 0 0 0.88  0 0 0 0 0.90  0 0 0.8 0 -0.53'/>
</filter>
<rect width='512' height='512' filter='url(#grime)'/>
<rect width='512' height='512' filter='url(#runs)'/>
<rect width='512' height='512' filter='url(#wet)'/>
</svg>
